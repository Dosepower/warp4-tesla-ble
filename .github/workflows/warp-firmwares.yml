name: WARP variant host checks
on:
  workflow_dispatch:
  push:
    branches: [feature/warp-remote]
  pull_request:
    paths:
      - 'software/*variants*'
      - 'software/tesla_build_guard.py'
      - 'software/warp4*review.ini'
      - 'software/src/modules/bluetooth_core/**'
      - 'software/src/modules/warp_remote/**'
      - 'software/src/modules/tesla_vehicle/**'
      - 'software/web/src/modules/tesla_vehicle/**'
      - 'software/tests/tesla_vehicle/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  portable-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Compile-time selection and shared radio host tests (no firmware)
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          python -m pytest -q
          software/tests/tesla_vehicle/test_build_variants.py
          software/tests/tesla_vehicle/test_remote_scan.py
