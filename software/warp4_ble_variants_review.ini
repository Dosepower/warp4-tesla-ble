; Three explicit compile-time selections; NONINSTALLABLE review ELF targets.
[warp_ble_variants]
custom_frontend_modules = ${env:warp4_tesla_ble.custom_frontend_modules}
custom_frontend_components = EVSE Group $ Open
                               Evse Common | EVSE Settings
                               Evse Common | EVSE
                               ISO15118
                               Charge Tracker
                               Automation
                             EVSE Group $ Close
                             Energy Management Group $ Open
                               Meters
                               Batteries
                               Charge Manager | Charge Manager Chargers
                               Power Manager | PV Excess Settings
                               Charge Manager | Charge Manager Settings
                               Day Ahead Prices
                               Solar Forecast
                               Eco
                               P14a Enwg
                               Ove R37
                             Energy Management Group $ Close
                             Network Group $ Open
                               Network
                               Wifi | Wifi STA
                               Wifi | Wifi AP
                               Ethernet
                               Wireguard
                             Network Group $ Close
                             Interfaces Group $ Open
                               Mqtt
                               Modbus TCP
                               Ocpp
                               EEBus
                               Tesla Vehicle | Bluetooth Page
                             Interfaces Group $ Close
                             Users Group $ Open
                               Users
                               Ev
                             Users Group $ Close
                             System Group $ Open
                               System
                               Certs
                               Remote Access
                               Time
                               Event Log
                               Firmware Update
                             System Group $ Close

[env:warp4_ble_tesla_only_review]
extends = env:warp4_tesla_ble_nimble_review
build_flags = ${env:warp4_tesla_ble_nimble_review.build_flags}
              -DWARP_FEATURE_TESLA=1
              -DWARP_FEATURE_REMOTE=0
custom_frontend_modules = ${warp_ble_variants.custom_frontend_modules}
custom_frontend_components = ${warp_ble_variants.custom_frontend_components}
custom_options = ${env:warp4.custom_options}
                 warp_feature_tesla = 1
                 warp_feature_remote = 0

[env:warp4_ble_remote_only_review]
extends = env:warp4_tesla_ble_nimble_review
build_flags = ${env:warp4_tesla_ble_nimble_review.build_flags}
              -DWARP_FEATURE_TESLA=0
              -DWARP_FEATURE_REMOTE=1
lib_deps = ${env:warp4.lib_deps}
lib_ignore = TeslaBLE
             TeslaBLEClean
custom_backend_modules = ${env:warp4.custom_backend_modules}
                         Warp Remote
custom_frontend_modules = ${warp_ble_variants.custom_frontend_modules}
custom_frontend_components = ${warp_ble_variants.custom_frontend_components}
custom_options = ${env:warp4.custom_options}
                 warp_feature_tesla = 0
                 warp_feature_remote = 1

[env:warp4_ble_combined_review]
extends = env:warp4_tesla_ble_nimble_review
build_flags = ${env:warp4_tesla_ble_nimble_review.build_flags}
              -DWARP_FEATURE_TESLA=1
              -DWARP_FEATURE_REMOTE=1
custom_frontend_modules = ${warp_ble_variants.custom_frontend_modules}
custom_frontend_components = ${warp_ble_variants.custom_frontend_components}
custom_options = ${env:warp4.custom_options}
                 warp_feature_tesla = 1
                 warp_feature_remote = 1
