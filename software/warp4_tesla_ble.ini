; Real WARP4 source-review target. No upload, signing, or installer generation.
; All board, partition, security and product settings inherit current upstream.
[env:warp4_tesla_ble]
extends = env:warp4
; Stack-use sidecars must be generated, not lost when restoring cached objects.
custom_build_cache_limit = -1
extra_scripts = pre:tesla_build_guard.py
                pre:pio_hooks.py
platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#0ca24d74b6ec582e2780a9fdc9aadead8e272739
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_LIBS}
lib_deps = ${env:warp4.lib_deps}
           TeslaBLEClean
lib_ignore = TeslaBLE
build_flags = ${env:warp4.build_flags}
              -DTESLA_BLE_MANUAL_VEHICLE_UI=1
              -fstack-usage
custom_backend_modules = ${env:warp4.custom_backend_modules}
                         Tesla Vehicle
custom_frontend_modules = ${env:warp4.custom_frontend_modules}
                          Tesla Vehicle
; Upstream order, with only the technical Bluetooth page added to Interfaces.
custom_frontend_components = EVSE Group $ Open
                               Evse Common | EVSE Settings
                               Evse Common | EVSE
                               ISO15118
                               Charge Tracker
                               Automation
                             EVSE Group $ Close
                             Energy Management Group $ Open
                               Meters
                               Batteries
                               Charge Manager | Charge Manager Chargers
                               Power Manager | PV Excess Settings
                               Charge Manager | Charge Manager Settings
                               Day Ahead Prices
                               Solar Forecast
                               Eco
                               P14a Enwg
                               Ove R37
                             Energy Management Group $ Close
                             Network Group $ Open
                               Network
                               Wifi | Wifi STA
                               Wifi | Wifi AP
                               Ethernet
                               Wireguard
                             Network Group $ Close
                             Interfaces Group $ Open
                               Mqtt
                               Modbus TCP
                               Ocpp
                               EEBus
                               Tesla Vehicle | Bluetooth Page
                             Interfaces Group $ Close
                             Users Group $ Open
                               Users
                               Ev
                             Users Group $ Close
                             System Group $ Open
                               System
                               Certs
                               Remote Access
                               Time
                               Event Log
                               Firmware Update
                             System Group $ Close

; Frontend-only verification uses upstream stock libraries, never produces ELF.
[env:warp4_tesla_ble_web]
extends = env:warp4_tesla_ble
platform_packages = ${env:warp4.platform_packages}
extra_scripts = pre:pio_hooks.py
custom_web_only = true
