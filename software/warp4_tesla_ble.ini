[env:warp4_tesla_ble]
extends = env:warp4

lib_deps = ${env:warp4.lib_deps}
           TeslaBLEClean

; Explicit exclusion prevents PlatformIO LDF from opening the retained library.
lib_ignore = TeslaBLE

platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#tf-3-3-12
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_LIBS}

build_flags = ${env:warp4.build_flags}
              -std=gnu++2b
              -fstack-usage
              -Wl,--wrap=esp_bt_mem_release
              -Wl,--wrap=esp_bt_controller_mem_release

custom_backend_modules = ${env:warp4.custom_backend_modules}
                         Tesla Vehicle

custom_frontend_modules = ${env:warp4.custom_frontend_modules}
                          Tesla Vehicle

custom_frontend_components = ${env:warp4.custom_frontend_components}
                             Tesla Vehicle

; The stock WARP4 framework package has Bluetooth disabled. This environment
; is switched to a locally rebuilt framework package by the preparation script.
