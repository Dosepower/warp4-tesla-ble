[env:warp4_tesla_ble]
extends = env:warp4

extra_scripts = pre:r13_vfs_guard.py
                ${env:warp4.extra_scripts}

lib_deps = ${env:warp4.lib_deps}
           TeslaBLEClean

; Explicit exclusion prevents PlatformIO LDF from opening the retained library.
lib_ignore = TeslaBLE

platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#tf-3-3-12
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_LIBS}

build_flags = ${env:warp4.build_flags}
              -std=gnu++2b
              -fstack-usage
              -Wl,--wrap=esp_bt_mem_release
              -Wl,--wrap=esp_bt_controller_mem_release

custom_backend_modules = ${env:warp4.custom_backend_modules}
                         Tesla Vehicle

custom_frontend_modules = ${env:warp4.custom_frontend_modules}
                          Tesla Vehicle

; Exact WARP4 component order with the one Bluetooth page inside Interfaces.
; Explicit list avoids changing navigation in non-BLE firmware environments.
custom_frontend_components = EVSE Group $ Open
                               Evse Common | EVSE Settings
                               Evse Common | EVSE
                               ISO15118
                               Charge Tracker
                               Automation
                             EVSE Group $ Close
                             Energy Management Group $ Open
                               Meters
                               Batteries
                               Charge Manager | Charge Manager Chargers
                               Power Manager | PV Excess Settings
                               Charge Manager | Charge Manager Settings
                               Day Ahead Prices
                               Solar Forecast
                               Eco
                               P14a Enwg
                               Ove R37
                             Energy Management Group $ Close
                             Network Group $ Open
                               Network
                               Wifi | Wifi STA
                               Wifi | Wifi AP
                               Ethernet
                               Wireguard
                             Network Group $ Close
                             Interfaces Group $ Open
                               Mqtt
                               Modbus TCP
                               Ocpp
                               EEBus
                               Tesla Vehicle
                             Interfaces Group $ Close
                             Users Group $ Open
                               Users
                               Ev
                             Users Group $ Close
                             System Group $ Open
                               System
                               Certs
                               Remote Access
                               Time
                               Event Log
                               Firmware Update
                             System Group $ Close

; The stock WARP4 framework package has Bluetooth disabled. This environment
; is switched to a locally rebuilt framework package by the preparation script.

; Build-only diagnostic environments. No automatic Tesla activation or bench mode.
[env:warp4_tesla_ble_iram_diag]
extends = env:warp4_tesla_ble

build_flags = ${env:warp4_tesla_ble.build_flags}
              -DTESLA_BLE_IRAM_DIAGNOSTICS=1
              -Wl,--wrap=esp_bt_controller_init
              -Wl,--wrap=esp_bt_controller_enable
              -Wl,--wrap=esp_bluedroid_init
              -Wl,--wrap=esp_bluedroid_enable
              -Wl,--wrap=esp_ble_gattc_register_callback
              -Wl,--wrap=esp_ble_gattc_app_register
              -Wl,--wrap=esp_ble_gattc_open

[env:warp4_tesla_ble_iram_minimal]
extends = env:warp4_tesla_ble_iram_diag

; Requires genuinely rebuilt IDF archives, NOT application -D overrides.
platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#tf-3-3-12
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_MINIMAL_FRAMEWORK_LIBS}

; BENCH ONLY: generic revision-3 ESP32 Ethernet Brick, 16 MB, no secure boot.
; Keep all WARP4 modules/partition contents and the deliberately disabled Tesla
; default. Do not use these images on a production wallbox or via stock OTA.
[env:warp4_tesla_ble_iram_bench]
extends = env:warp4_tesla_ble_iram_diag
board = esp32_ethernet_brick
board_upload.arduino.partitions_bin = 0xe000
board_upload.arduino.boot_app0 = 0x640000
; Use IDF's actual binary, retaining its minimum/maximum silicon revision header.
; PlatformIO's default ELF conversion drops those limits.
board_build.arduino.custom_bootloader = ${sysenv.TESLA_BLE_BENCH_FRAMEWORK_LIBS}/esp32/bin/bootloader_qio_80m.bin

platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#tf-3-3-12
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_BENCH_FRAMEWORK_LIBS}

build_flags = ${env:warp4_tesla_ble_iram_diag.build_flags}
              -DTESLA_BLE_BENCH_ONLY=1
              -Wl,--wrap=pvPortMalloc

custom_provisioning = false
custom_bench_only = true
custom_secure_boot =
custom_signature_preset =
custom_bench_builder = ${sysenv.TESLA_BLE_BENCH_BUILDER}
; pio_hooks.py owns a separate SCons object cache; PlatformIO's cache-dir
; environment variable does not disable it. Bench evidence requires recompiles.
custom_build_cache_limit = -1

extra_scripts = pre:bench_guard_hook.py
                pre:r13_vfs_guard.py
                pre:pio_hooks.py
                post:bench_image_hook.py

[env:warp4_tesla_ble_iram_bench_minimal]
extends = env:warp4_tesla_ble_iram_bench
board_build.arduino.custom_bootloader = ${sysenv.TESLA_BLE_BENCH_MINIMAL_FRAMEWORK_LIBS}/esp32/bin/bootloader_qio_80m.bin
platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#tf-3-3-12
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_BENCH_MINIMAL_FRAMEWORK_LIBS}
custom_bench_builder = ${sysenv.TESLA_BLE_BENCH_MINIMAL_BUILDER}
