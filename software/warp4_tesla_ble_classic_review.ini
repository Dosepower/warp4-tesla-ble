; Local isolated Classic-controller release + bounded read-only memory samples.
; Same upstream layout/security, no installer/signing/upload target or approval.
[env:warp4_tesla_ble_classic_review]
extends = env:warp4_tesla_ble_verifier_review
platform_packages = platformio/framework-arduinoespressif32 @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_CORE}
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_LIBS}
build_flags = ${env:warp4_tesla_ble.build_flags}
              -DWARP_TESLA_MEMORY_PHASES=1
