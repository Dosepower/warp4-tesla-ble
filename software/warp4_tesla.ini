; WARP4 Tesla BLE minimal candidate. Real WARP4 target: board, partitions, security, signing/OTA metadata,
; product options and all upstream modules inherit env:warp4 (official afa5c782). No upload target is used.
; SDK: official defconfig.esp32secure + documented BLE/NimBLE-PSRAM/ext-stack overlay (lib-builder/defconfig.esp32secure-tesla),
; rebuilt offline and frozen at sdk/variant-warp4-tesla (see SDK_DELTA.md); the build links a writable copy
; (sdk/variant-warp4-tesla-work) because the platform component manager backs up/edits pioarduino-build.py.
; CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=2048 unchanged.
[env:warp4_tesla]
extends = env:warp4
extra_scripts = pre:tesla_production_build.py
                ${env:warp4.extra_scripts}
platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/Tinkerforge/arduino-esp32#tf-3-3-12
                    platformio/framework-arduinoespressif32-libs @ symlink://brick_sdk/selected
lib_deps = ${env:warp4.lib_deps}
           TeslaBLEClean
lib_ignore = TeslaBLE
build_flags = ${env:warp4.build_flags}
              -DTESLA_BLE_MANUAL_VEHICLE_UI=1
              -DTESLA_BLE_USE_NIMBLE=1
              -DWARP_BLUETOOTH_LITTLEFS_BINDING=0x57415234
              -DTESLA_PSRAM_PLACEMENT=1
              -DTESLA_WORKER_PSRAM_STACK=1
              -DTESLA_STORAGE_EXECUTOR=1
              -DTESLA_NIMBLE_DISPATCH=1
              -fstack-usage
custom_backend_modules = ${env:warp4.custom_backend_modules}
                         Tesla Vehicle
custom_frontend_modules = ${env:warp4.custom_frontend_modules}
                          Tesla Vehicle
custom_frontend_components = EVSE Group $ Open
                               Evse Common | EVSE Settings
                               Evse Common | EVSE
                               ISO15118
                               Charge Tracker
                               Automation
                             EVSE Group $ Close
                             Energy Management Group $ Open
                               Meters
                               Batteries
                               Charge Manager | Charge Manager Chargers
                               Power Manager | PV Excess Settings
                               Charge Manager | Charge Manager Settings
                               Day Ahead Prices
                               Solar Forecast
                               Eco
                               P14a Enwg
                               Ove R37
                             Energy Management Group $ Close
                             Network Group $ Open
                               Network
                               Wifi | Wifi STA
                               Wifi | Wifi AP
                               Ethernet
                               Wireguard
                             Network Group $ Close
                             Interfaces Group $ Open
                               Mqtt
                               Modbus TCP
                               Ocpp
                               EEBus
                               Tesla Vehicle | Bluetooth Page
                             Interfaces Group $ Close
                             Users Group $ Open
                               Users
                               Ev
                             Users Group $ Close
                             System Group $ Open
                               System
                               Certs
                               Remote Access
                               Time
                               Event Log
                               Firmware Update
                             System Group $ Close
