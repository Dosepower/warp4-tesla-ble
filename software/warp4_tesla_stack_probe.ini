; LST1 lifecycle stack TRIAL lab target, copied
; from LSP1. Identical to env:warp4_tesla (MQR1 source, same SDK symlink) except the Tesla-local lifecycle stack
; constant (bluetooth_lifecycle_stack.h, 3072 trial) plus ONE flag that compiles the lifecycle stack probe. Not a production target; tesla_production_build.py rejects the flag in any other env.
; HAP1 (heap-arena-probe candidate): + -DWARP_HEAP_ARENA_PROBE=1 (INTERNAL|8BIT heap walk + DRAM arena snapshot, diagnostic only).
[env:warp4_tesla_stack_probe]
extends = env:warp4_tesla
build_flags = ${env:warp4_tesla.build_flags}
              -DTESLA_LIFECYCLE_STACK_PROBE=1
              -DWARP_HEAP_ARENA_PROBE=1
