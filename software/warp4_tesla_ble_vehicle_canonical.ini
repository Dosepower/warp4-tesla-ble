; Isolated test-hardware app-only candidate. Full Tesla backend; no reduced/diagnostic mode.
; Reuses the source-bound canonical SDK and stock slots. Never upload/merge/sign.
[env:warp4_tesla_ble_vehicle_canonical]
extends = env:warp4_tesla_ble_psram
board = esp32_ethernet_brick
board_build.partitions = default_16MB_coredump.csv
board_upload.arduino.partitions_bin = 0x8000
board_upload.arduino.boot_app0 = 0xe000
board_build.arduino.custom_bootloader = ${sysenv.TESLA_BLE_FRAMEWORK_LIBS}/esp32/bin/bootloader_qio_80m.bin
custom_provisioning = false
custom_bench_only = true
custom_secure_boot =
custom_signature_preset =
extra_scripts = pre:r13_psram_guard.py
                pre:canonical_offline_cache.py
                pre:pio_hooks.py
                post:r13_lean_link.py
build_flags = ${env:warp4_tesla_ble.build_flags}
              -DTESLA_BLE_CANONICAL_LAYOUT_BENCH=1
              -DTESLA_BLE_MANUAL_VEHICLE_UI=1
              -DBLUETOOTH_CONFIG_PATH=\"/data/config/bluetooth_manual_web_bench_config\"
              -Wl,--wrap=esp_vfs_littlefs_register
