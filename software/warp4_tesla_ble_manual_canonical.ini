; NEW canonical layout; deliberately NOT the byte-identical Retry8 SDK.
[env:warp4_tesla_ble_psram_manual_canonical]
extends = env:warp4_tesla_ble_psram_manual_bench
board_build.partitions = default_16MB_coredump.csv
board_upload.arduino.partitions_bin = 0x8000
board_upload.arduino.boot_app0 = 0xe000
extra_scripts = pre:r13_psram_guard.py
                pre:canonical_offline_cache.py
                pre:pio_hooks.py
                post:r13_lean_link.py
build_flags = ${env:warp4_tesla_ble_psram_manual_bench.build_flags}
              -DTESLA_BLE_CANONICAL_LAYOUT_BENCH=1
              -Wl,--wrap=esp_vfs_littlefs_register
