; Direct native ESP-IDF NimBLE; local unsigned source review only.
[env:warp4_tesla_ble_nimble_review]
extends = env:warp4_tesla_ble_classic_review
platform_packages = platformio/framework-arduinoespressif32 @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_CORE}
                    platformio/framework-arduinoespressif32-libs @ symlink://${sysenv.TESLA_BLE_FRAMEWORK_LIBS}
build_flags = ${env:warp4_tesla_ble_classic_review.build_flags}
              -DTESLA_BLE_USE_NIMBLE=1
